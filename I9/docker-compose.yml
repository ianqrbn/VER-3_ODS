# Kafka local (KRaft, nó único) para testar o I9 ponta a ponta antes do B3.
#   docker compose up -d
#   -> broker em localhost:9092 com os tópicos do I9 já criados
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: ods-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29092
        $$T --bootstrap-server $$B --create --if-not-exists --topic ods.i1.detections --partitions 3
        $$T --bootstrap-server $$B --create --if-not-exists --topic ods.i9.ppe_compliance --partitions 3
        $$T --bootstrap-server $$B --create --if-not-exists --topic ods.i9.dlq --partitions 1
        # compactado: o broker guarda a última calibração de cada câmera (chave = source_id)
        $$T --bootstrap-server $$B --create --if-not-exists --topic ods.i3.calibration --partitions 1 --config cleanup.policy=compact
        # compactado: o broker guarda o último anúncio de cada artefato (chave = artifact_id)
        $$T --bootstrap-server $$B --create --if-not-exists --topic ods.artifact.published --partitions 1 --config cleanup.policy=compact
        $$T --bootstrap-server $$B --list
